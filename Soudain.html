*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ownerbar{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:0 0 8px 8px;font-size:13px}
.ownerbar button{background:var(--bg);color:var(--ink);border:0;border-radius:999px;padding:6px 14px;font-weight:500}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-size:26px;letter-spacing:.01em;line-height:1;min-width:0}

.bagbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--ink);background:transparent;border-radius:999px;padding:9px 16px;font-weight:500;flex:none}
.bagbtn .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:22px;height:22px;padding:0 6px;display:inline-grid;place-items:center;font-size:12px}

.intro{padding:28px 0 8px;display:flex;flex-wrap:wrap;gap:8px 32px;align-items:end;justify-content:space-between}
.intro h1{font-family:var(--font-display);font-weight:500;font-size:clamp(30px,6vw,52px);line-height:1.05;margin:0;max-width:16ch;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:34ch}

.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 12px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;background:none;border:0;padding:0;min-width:0}
.tile{aspect-ratio:4/5;border-radius:6px;display:grid;place-items:center;position:relative;overflow:hidden;max-width:100%}
.tile svg{width:46%;height:auto;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.55}

.tile .tag{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--ink);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-variant-numeric:tabular-nums;font-weight:500}
.dots{display:flex;gap:4px}

.empty{padding:40px 0;color:var(--muted)}

.how{margin-top:44px;padding-top:24px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}

.x{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:12px;border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.sheet .tile{aspect-ratio:4/3;margin-bottom:14px}
.sheet .tile svg{width:22%}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 14px;min-width:44px}

.swatch{display:inline-flex;align-items:center;gap:8px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);padding:14px 18px;font-weight:600;font-size:15px;margin-top:18px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px;font-weight:500}
.btn.danger,.mini.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}
.mini{border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 12px;font-size:13px}

.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .tile{aspect-ratio:1;border-radius:4px}.line .tile svg{width:55%}
.line b{font-weight:500}.line small{display:block;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;margin-top:6px}
.qty button{border:0;background:none;width:30px;height:28px;font-size:16px}
.qty span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.sum{display:grid;gap:4px;padding:14px 0}
.sum div{display:flex;justify-content:space-between;color:var(--muted)}
.sum .tot{color:var(--ink);font-weight:600;font-size:17px;padding-top:6px}
label.f{display:block;margin-top:12px;font-size:13px;color:var(--muted)}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{display:inline-block;width:auto;margin:0 10px 0 0}

.note{font-size:13px;color:var(--muted);margin-top:10px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .btn{margin-top:14px}

/* ---- state: this page is the record; saving republishes it with the data embedded above ---- */
let DATA = null;
try { DATA = JSON.parse($("#shop-data").textContent); } catch(e) {}
let shop = Object.assign({}, DEFAULT_SHOP, DATA && DATA.shop);
let cats = (DATA && DATA.categories && DATA.categories.length) ? DATA.categories.slice() : DEFAULT_CATS.slice();
let products = (DATA && Array.isArray(DATA.products)) ? DATA.products : sampleProducts();
let filter = "All", isOwner = false, cart = [];
try { cart = JSON.parse(localStorage.getItem("md_cart") || "[]"); } catch(e) { cart = []; }
cart = cart.filter(l => l && products.some(p => p.id === l.id));
const saveCart = () => { try { localStorage.setItem("md_cart", JSON.stringify(cart)); } catch(e) {} };

const money = n => shop.currency + (Math.round(n*100)/100).toString();
const prod = id => products.find(p => p.id === id);
const colorsOf = p => Array.isArray(p.colors) ? p.colors : [];
const sizesOf = p => Array.isArray(p.sizes) ? p.sizes : [];

function tile(p, extra=""){
  const i = Math.max(0, cats.indexOf(p.cat)) % 5 + 1;
  const inner = p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}">` : (ICONS[p.cat] || ICON_DEFAULT);
  return `<div class="tile" style="background:var(--t${i})">${inner}${extra}</div>`;
}
function tagOf(p){ return p.soldOut ? `<span class="tag">Sold out</span>` : (p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""); }

function renderShell(){
  $("#bn").textContent = shop.name;
  $("#tagline").textContent = shop.tagline;
  $("#headline").textContent = shop.headline;
  $("#introp").textContent = shop.intro;
  $("#policy").textContent = shop.policy;
  $("#footnote").textContent = `Questions? Message us on Instagram @${shop.instagram} or WhatsApp ${shop.whatsappShown}. Photos show sample colors and may vary slightly.`;
}
function renderChips(){
  $("#chips").innerHTML = ["All",...cats].map(c => `<button class="chip" data-c="${esc(c)}" aria-pressed="${c===filter}">${esc(c)}</button>`).join("");
}
function renderGrid(){
  const list = products.filter(p => filter==="All" || p.cat===filter);
  $("#grid").innerHTML = list.length ? list.map(p => `
    <button class="card" data-id="${esc(p.id)}">
      ${tile(p, tagOf(p))}
      <h3>${esc(p.name)}</h3>
      <div class="row"><span class="price">${money(p.price)}</span>
        <span class="dots">${colorsOf(p).map(c=>`<i class="dot" style="background:${esc(c.hex)}"></i>`).join("")}</span></div>
    </button>`).join("") : `<p class="empty">Nothing here yet.</p>`;
}
function updateCount(){ $("#count").textContent = cart.reduce((a,l)=>a+l.qty,0); }

const L = $("#layer");
function closeLayer(){ L.innerHTML = ""; L.onclick = L.oninput = L.onchange = null; }
function paint(html){
  const old = L.querySelector(".panel"), st = old ? old.scrollTop : 0;
  L.innerHTML = html;
  const np = L.querySelector(".panel"); if(np) np.scrollTop = st;
}
let tt;
function toast(msg){
  document.querySelectorAll(".toast").forEach(n=>n.remove());
  const d = document.createElement("div"); d.className="toast"; d.textContent=msg; d.setAttribute("role","status");
  document.body.appendChild(d); clearTimeout(tt); tt=setTimeout(()=>d.remove(),2600);
}

/* ---- customer: product sheet ---- */
function openProduct(id){
  const p = prod(id); if(!p) return;
  const cs = colorsOf(p), ss = sizesOf(p);
  let color = cs.length ? cs[0].name : "", size = ss.length ? ss[0] : "";
  const draw = () => {
    paint(`<div class="scrim" data-close></div>
    <div class="panel sheet" role="dialog" aria-label="${esc(p.name)}">
      <button class="x" data-close aria-label="Close">×</button>
      ${tile(p)}
      <div class="row"><h2 style="padding:0">${esc(p.name)}</h2><span class="price" style="font-size:18px">${money(p.price)}</span></div>
      <p style="color:var(--muted);margin:6px 0 0">${esc(p.desc)}</p>
      ${cs.length ? `<div class="lbl">Color · ${esc(color)}</div>
      <div class="opts">${cs.map((c,i)=>`<button class="opt swatch" data-color="${i}" aria-pressed="${c.name===color}"><i class="dot" style="background:${esc(c.hex)}"></i>${esc(c.name)}</button>`).join("")}</div>` : ""}
      ${ss.length ? `<div class="lbl">Size</div><div class="opts">${ss.map((s,i)=>`<button class="opt" data-size="${i}" aria-pressed="${s===size}">${esc(s)}</button>`).join("")}</div>` : ""}
      ${p.soldOut ? `<button class="btn" disabled>Sold out</button>` : `<button class="btn" id="add">Add to bag · ${money(p.price)}</button>`}
    </div>`);
  };
  draw();
  L.onclick = e => {
    const t = e.target.closest("button,[data-close]"); if(!t) return;
    if(t.dataset.close !== undefined){ closeLayer(); return; }
    if(t.dataset.color !== undefined){ color = cs[+t.dataset.color].name; draw(); }
    else if(t.dataset.size !== undefined){ size = ss[+t.dataset.size]; draw(); }
    else if(t.id==="add"){
      const f = cart.find(l => l.id===id && l.color===color && l.size===size);
      if(f) f.qty++; else cart.push({id,color,size,qty:1});
      saveCart(); updateCount(); closeLayer(); toast(`${p.name} added to your bag`);
    }
  };
}

/* ---- customer: bag and checkout ---- */
function totals(){
  const sub = cart.reduce((a,l)=>{ const p = prod(l.id); return a + (p?p.price*l.qty:0); }, 0);
  const free = shop.freeOver>0 && sub>=shop.freeOver;
  const ship = cart.length ? (free ? 0 : +shop.deliveryFee||0) : 0;
  return {sub, ship, total: sub+ship};
}
function orderText(){
  const t = totals(), g = id => (($("#"+id))||{}).value||"";
  const lines = cart.map(l => { const p = prod(l.id);
    const opt = [l.color,l.size].filter(Boolean).join(", ");
    return `• ${l.qty} × ${p.name}${opt?" ("+opt+")":""} — ${money(p.price*l.qty)}`; });
  return `Hello ${shop.name}, I would like to order:\n${lines.join("\n")}\n\nSubtotal: ${money(t.sub)}\nDelivery: ${t.ship?money(t.ship):"Free"}\nTotal: ${money(t.total)}\n\nName: ${g("fName")}\nPhone: ${g("fPhone")}\nAddress: ${g("fAddr")}\nNotes: ${g("fNote")}`;
}
function openBag(){
  const draw = keep => {
    const t = totals();
    const vals = keep ? ["fName","fPhone","fAddr","fNote"].map(i=>(($("#"+i))||{}).value||"") : ["","","",""];
    paint(`<div class="scrim" data-close></div>
    <div class="panel" role="dialog" aria-label="Your bag">
      <button class="x" data-close aria-label="Close">×</button>
      <h2>Your bag</h2>
      ${cart.length ? cart.map((l,i)=>{ const p = prod(l.id); return `
        <div class="line">${tile(p)}
          <div><b>${esc(p.name)}</b><small>${esc([l.color,l.size].filter(Boolean).join(" · "))}</small>
            <div class="qty"><button data-dec="${i}" aria-label="Fewer">−</button><span>${l.qty}</span><button data-inc="${i}" aria-label="More">+</button></div></div>
          <span class="price">${money(p.price*l.qty)}</span></div>`}).join("") : `<p class="empty">Your bag is empty.</p>`}
      ${cart.length ? `
      <div class="sum"><div><span>Subtotal</span><span>${money(t.sub)}</span></div>
        <div><span>Delivery</span><span>${t.ship?money(t.ship):"Free"}</span></div>
        <div class="tot"><span>Total</span><span>${money(t.total)}</span></div></div>
      <label class="f" for="fName">Your name<input id="fName" autocomplete="name" value="${esc(vals[0])}"></label>
      <label class="f" for="fPhone">Phone number<input id="fPhone" type="text" inputmode="tel" autocomplete="tel" value="${esc(vals[1])}"></label>
      <label class="f" for="fAddr">Delivery address (area, street, building, floor)<textarea id="fAddr" rows="2" autocomplete="street-address">${esc(vals[2])}</textarea></label>
      <label class="f" for="fNote">Notes (optional)<input id="fNote" value="${esc(vals[3])}"></label>
      <a class="btn" id="wa" target="_blank" rel="noopener" href="#" aria-disabled="true">Send order on WhatsApp</a>
      <a class="btn alt" target="_blank" rel="noopener" href="https://ig.me/m/${esc(shop.instagram)}">Message us on Instagram instead</a>
      <button class="btn alt" id="copy">Copy order text</button>
      <p class="note">${esc(shop.policy)} We confirm your order on WhatsApp (${esc(shop.whatsappShown)}).</p>` : ""}
    </div>`);
    syncWa();
  };
  const syncWa = () => {
    const wa = $("#wa"); if(!wa) return;
    const ready = $("#fName").value.trim() && $("#fPhone").value.trim() && $("#fAddr").value.trim();
    wa.setAttribute("aria-disabled", ready ? "false" : "true");
    wa.href = ready ? `https://wa.me/${String(shop.whatsapp).replace(/\D/g,"")}?text=${encodeURIComponent(orderText())}` : "#";
  };
  draw(false);
  L.oninput = syncWa;
  L.onclick = e => {
    const t = e.target.closest("button,[data-close]"); if(!t) return;
    if(t.dataset.close !== undefined){ closeLayer(); return; }
    if(t.dataset.inc !== undefined){ cart[+t.dataset.inc].qty++; }
    else if(t.dataset.dec !== undefined){ const l = cart[+t.dataset.dec]; l.qty--; if(l.qty<1) cart.splice(+t.dataset.dec,1); }
    else if(t.id==="copy"){
      const txt = orderText();
      const fb = () => { const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("Order copied");}catch(_){toast("Select and copy the text manually");} ta.remove(); };
      if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast("Order copied"),fb); else fb();
      return;
    } else return;
    saveCart(); updateCount(); draw(true);
  };
}

/* ---- owner: save by republishing this page with the data embedded ---- */
function readImage(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const im = new Image(); im.onerror = rej;
      im.onload = () => { const s = Math.min(1, 900/Math.max(im.width,im.height));
        const cv = document.createElement("canvas"); cv.width = Math.round(im.width*s); cv.height = Math.round(im.height*s);
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg",.8)); };
      im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
async function persist(){
  let art = null;
  try { art = window.claude && await claude.use("artifact"); } catch(e) {}
  if(!art){ toast("Saving is not available in this view."); return false; }
  const json = JSON.stringify({v:1,shop,categories:cats,products}).replace(/</g,"\\u003c");
  if(json.length > 13e6){ toast("Too many photos for one page. Remove a few products or photos."); return false; }
  const t = document.createElement("template"); t.innerHTML = PRISTINE;
  t.content.getElementById("shop-data").textContent = json;
  const html = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + HEAD_STYLE + '</style></head><body>' + t.innerHTML + '</body></html>';
  try { location.hash = "admin"; await art.publish(html); return true; }
  catch(e){
    const c = e && e.code;
    toast(c==="conflict" ? "Someone saved at the same time. The page is reloading." : (c==="not_granted"||c==="not_writer") ? "You do not have permission to edit this shop." : "Could not save. Please try again.");
    return false;
  }
}

function openManage(startView){
  let view = startView || "list", draft = null, sdraft = null, err = "", confirmDel = false, confirmSamples = false, busy = false;
  const blank = () => ({id:"",name:"",cat:cats[0]||"",price:"",tag:"",desc:"",colors:[{name:"",hex:"#E8B7C8"}],sizes:"",img:"",soldOut:false});

  const listView = () => `
    <h2>Manage shop</h2>
    <p class="note">Changes go live for everyone as soon as you save.</p>
    <div class="two"><button class="btn" data-act="add">Add product</button><button class="btn alt" data-act="settings">Shop settings</button></div>
    ${products.some(p=>p.sample) ? `<div class="notice"><span>Sample products are showing.</span><button class="mini" data-act="clearsamples">${confirmSamples?"Tap again to remove them":"Remove sample products"}</button></div>` : ""}
    <div style="margin-top:10px">${products.length ? products.map(p=>`
      <div class="line">${tile(p)}<div><b>${esc(p.name)}</b><small>${money(p.price)} · ${esc(p.cat)}${p.soldOut?" · Sold out":""}</small></div>
      <button class="mini" data-edit="${esc(p.id)}">Edit</button></div>`).join("") : `<p class="empty">No products yet. Tap Add product.</p>`}</div>`;

  const formView = () => `
    <h2>${draft.id ? "Edit product" : "New product"}</h2>
    <label class="f" for="pName">Name<input id="pName" data-f="name" value="${esc(draft.name)}" placeholder="Satin Slip Chemise"></label>
    <div class="grid2">
      <label class="f" for="pCat">Category<select id="pCat" data-f="cat">${cats.map(c=>`<option ${c===draft.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
      <label class="f" for="pPrice">Price (${esc(shop.currency)})<input id="pPrice" data-f="price" inputmode="decimal" value="${esc(draft.price)}" placeholder="25"></label>
    </div>
    <label class="f" for="pTag">Label on the photo (optional)<input id="pTag" data-f="tag" value="${esc(draft.tag)}" placeholder="New, Bestseller, Sale"></label>
    <label class="f" for="pDesc">Description<textarea id="pDesc" data-f="desc" rows="3" placeholder="Fabric, fit, care">${esc(draft.desc)}</textarea></label>
    <div class="lbl">Photo</div>
    <div class="photo">${tile({cat:draft.cat,name:draft.name,img:draft.img})}
      <div><input id="pPhoto" type="file" accept="image/*" style="margin:0">${draft.img?`<button class="mini" data-act="clearphoto" style="margin-top:8px">Remove photo</button>`:""}</div></div>
    <div class="lbl">Colors</div>
    ${draft.colors.map((c,i)=>`<div class="crow"><input type="color" data-ci="${i}" data-k="hex" value="${esc(c.hex)}" aria-label="Color ${i+1}"><input data-ci="${i}" data-k="name" value="${esc(c.name)}" placeholder="Color name" aria-label="Color name ${i+1}"><button data-delc="${i}" aria-label="Remove color">×</button></div>`).join("")}
    <div class="lbl" style="margin-top:12px">Quick colors</div>
    <div class="sizes">${PRESETS.map((c,i)=>`<button class="mini swatch" data-preset="${i}"><i class="dot" style="background:${c.hex}"></i>${c.name}</button>`).join("")}</div>
    <button class="mini" data-act="addcolor" style="margin-top:10px">Add another color</button>
    <label class="f" for="pSizes">Sizes (separate with commas, leave empty if none)<input id="pSizes" data-f="sizes" value="${esc(draft.sizes)}" placeholder="S, M, L"></label>
    <div class="sizes"><button class="mini" data-sz="XS, S, M, L, XL">XS to XL</button><button class="mini" data-sz="36, 38, 40, 42">36 to 42</button><button class="mini" data-sz="One size">One size</button><button class="mini" data-sz="">No sizes</button></div>
    <label class="chk"><input type="checkbox" data-f="soldOut" ${draft.soldOut?"checked":""}>Sold out</label>
    ${err ? `<p class="err">${esc(err)}</p>` : ""}
    <button class="btn" data-act="save" ${busy?"disabled":""}>${busy?"Saving…":"Save product"}</button>
    <button class="btn alt" data-act="back">Cancel</button>
    ${draft.id ? `<button class="btn alt danger" data-act="del">${confirmDel?"Tap again to delete for good":"Delete product"}</button>` : ""}`;

  const settingsView = () => {
    const f = (k,label,ph="") => `<label class="f" for="s_${k}">${label}<input id="s_${k}" data-s="${k}" value="${esc(sdraft[k])}" placeholder="${esc(ph)}"></label>`;
    return `<h2>Shop settings</h2>
    ${f("name","Shop name")}${f("tagline","Line under the name")}${f("headline","Headline on the front page")}
    <label class="f" for="s_intro">Short intro<textarea id="s_intro" data-s="intro" rows="2">${esc(sdraft.intro)}</textarea></label>
    ${f("whatsapp","WhatsApp number for orders (country code, digits only)","96170123456")}
    ${f("whatsappShown","WhatsApp number as shown to customers","+961 70 123 456")}
    ${f("instagram","Instagram handle (without @)")}
    <div class="grid2">${f("currency","Currency symbol","$")}${f("deliveryFee","Delivery fee","3")}</div>
    ${f("freeOver","Free delivery above (0 for never)","60")}
    <label class="f" for="s_policy">Payment and returns note<textarea id="s_policy" data-s="policy" rows="2">${esc(sdraft.policy)}</textarea></label>
    <label class="f" for="s_cats">Categories, one per line<textarea id="s_cats" data-s="cats" rows="5">${esc(sdraft.cats)}</textarea></label>
    ${err ? `<p class="err">${esc(err)}</p>` : ""}
    <button class="btn" data-act="savesettings" ${busy?"disabled":""}>${busy?"Saving…":"Save settings"}</button>
    <button class="btn alt" data-act="back">Cancel</button>`;
  };

  const draw = () => paint(`<div class="scrim" data-close></div><div class="panel" role="dialog" aria-label="Manage shop"><button class="x" data-close aria-label="Close">×</button>${view==="list"?listView():view==="form"?formView():settingsView()}</div>`);
  const toForm = p => { draft = p ? {id:p.id,name:p.name,cat:p.cat,price:String(p.price),tag:p.tag||"",desc:p.desc||"",colors:colorsOf(p).map(c=>({name:c.name,hex:c.hex})),sizes:sizesOf(p).join(", "),img:p.img||"",soldOut:!!p.soldOut} : blank();
    if(!draft.colors.length) draft.colors.push({name:"",hex:"#E8B7C8"}); view="form"; err=""; confirmDel=false; };

  async function saveProduct(){
    const price = parseFloat(String(draft.price).replace(",","."));
    if(!draft.name.trim()){ err="Enter a name."; draw(); return; }
    if(!(price>=0)){ err="Enter a price, for example 25."; draw(); return; }
    const item = {id:draft.id||uid(),cat:draft.cat,name:draft.name.trim(),price,tag:draft.tag.trim(),desc:draft.desc.trim(),
      colors:draft.colors.filter(c=>c.name.trim()).map(c=>({name:c.name.trim(),hex:c.hex})),
      sizes:draft.sizes.split(",").map(s=>s.trim()).filter(Boolean),img:draft.img,soldOut:!!draft.soldOut};
    const before = products.slice();
    const i = products.findIndex(p=>p.id===item.id);
    if(i>=0) products[i]=item; else products.unshift(item);
    busy=true; err=""; draw();
    if(!await persist()){ products=before; busy=false; draw(); }
  }
  async function saveSettings(){
    const s = sdraft, list = s.cats.split("\n").map(x=>x.trim()).filter(Boolean);
    if(!s.name.trim()){ err="Enter a shop name."; draw(); return; }
    if(!list.length){ err="Add at least one category."; draw(); return; }
    const bs = shop, bc = cats;
    shop = Object.assign({}, shop, {name:s.name.trim(),tagline:s.tagline.trim(),headline:s.headline.trim(),intro:s.intro.trim(),policy:s.policy.trim(),
      whatsapp:s.whatsapp.replace(/\D/g,""),whatsappShown:s.whatsappShown.trim(),instagram:s.instagram.replace(/^@/,"").trim(),
      currency:s.currency.trim()||"$",deliveryFee:parseFloat(s.deliveryFee)||0,freeOver:parseFloat(s.freeOver)||0});
    cats = list; busy=true; err=""; draw();
    if(!await persist()){ shop=bs; cats=bc; busy=false; draw(); }
  }

  draw();
  L.oninput = e => {
    const d = e.target.dataset;
    if(d.f && draft) draft[d.f] = e.target.type==="checkbox" ? e.target.checked : e.target.value;
    else if(d.ci !== undefined && draft) draft.colors[+d.ci][d.k] = e.target.value;
    else if(d.s && sdraft) sdraft[d.s] = e.target.value;
  };
  L.onchange = async e => {
    if(e.target.id !== "pPhoto" || !e.target.files[0]) return;
    try { draft.img = await readImage(e.target.files[0]); err=""; } catch(x){ err="Could not read that image. Try a JPG or PNG."; }
    draw();
  };
  L.onclick = async e => {
    const t = e.target.closest("button,[data-close]"); if(!t || busy) return;
    const d = t.dataset;
    if(d.close !== undefined){ closeLayer(); if(location.hash==="#admin") location.hash=""; return; }
    if(d.edit){ toForm(prod(d.edit)); draw(); return; }
    if(d.delc !== undefined){ draft.colors.splice(+d.delc,1); draw(); return; }
    if(d.sz !== undefined){ draft.sizes = d.sz; draw(); return; }
    if(d.preset !== undefined){ const pr = PRESETS[+d.preset], last = draft.colors[draft.colors.length-1];
      if(last && !last.name.trim()){ last.name = pr.name; last.hex = pr.hex; } else draft.colors.push({name:pr.name,hex:pr.hex}); draw(); return; }
    switch(d.act){
      case "add": toForm(null); draw(); break;
      case "back": view="list"; err=""; confirmDel=false; draw(); break;
      case "settings": sdraft = Object.assign({}, shop, {cats:cats.join("\n")}); sdraft.deliveryFee=String(shop.deliveryFee); sdraft.freeOver=String(shop.freeOver); view="settings"; err=""; draw(); break;
      case "addcolor": draft.colors.push({name:"",hex:"#E8B7C8"}); draw(); break;
      case "clearphoto": draft.img=""; draw(); break;
      case "save": await saveProduct(); break;
      case "savesettings": await saveSettings(); break;
      case "del":
        if(!confirmDel){ confirmDel=true; draw(); break; }
        { const before = products.slice(); products = products.filter(p=>p.id!==draft.id); cart = cart.filter(l=>l.id!==draft.id); saveCart();
          busy=true; draw(); if(!await persist()){ products=before; busy=false; draw(); } }
        break;
      case "clearsamples":
        if(!confirmSamples){ confirmSamples=true; draw(); break; }
        { const before = products.slice(); products = products.filter(p=>!p.sample); busy=true; draw();
          if(!await persist()){ products=before; busy=false; confirmSamples=false; draw(); } }
        break;
    }
  };
}

$("#openBag").onclick = openBag;

document.addEventListener("keydown", e => { if(e.key==="Escape") closeLayer(); });
renderShell(); renderChips(); renderGrid(); updateCount();

(async () => {
  try {
    if(!(window.claude && claude.use)) return;
    const user = await claude.use("user"), art = await claude.use("artifact");
    if(user && art && user.canEdit()){
      isOwner = true; $("#ownerbar").hidden = false;
      if(location.hash === "#admin") openManage("list");
    }
  } catch(e) {}
})();
